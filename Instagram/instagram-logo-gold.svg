<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6A3"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Fundo preto arredondado -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0A0A0A"/>
  <!-- Contorno externo (câmera) -->
  <rect x="112" y="112" width="288" height="288" rx="72" ry="72" fill="none" stroke="url(#goldGrad)" stroke-width="28"/>
  <!-- Lente central -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="26"/>
  <!-- Flash / bolinha -->
  <circle cx="344" cy="168" r="20" fill="url(#goldGrad)"/>
</svg>