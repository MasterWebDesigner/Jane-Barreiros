<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <title>Login — Studio Jane Barreiros</title>
  <link rel="icon" href="./Logomarca.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',system-ui,sans-serif;
      background:#0A0A0A;
      color:#E5E7EB;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:auto;
    }
    .font-display { font-family:'Playfair Display',Georgia,serif; }
    .font-numeric { font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }

    .login-wrapper {
      width:100%;
      max-width:420px;
      padding:20px;
    }

    .login-card {
      background:#121212;
      border:1px solid rgba(212,175,55,.15);
      border-radius:20px;
      padding:40px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 80px rgba(212,175,55,.03);
      animation: fadeUp .5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to { opacity:1; transform:translateY(0); }
    }

    .logo-wrap {
      text-align:center;
      margin-bottom:32px;
    }
    .logo-wrap img {
      height:64px;
      width:auto;
      filter: drop-shadow(0 0 20px rgba(212,175,55,.2));
    }
    .logo-wrap h1 {
      font-family:'Playfair Display',Georgia,serif;
      font-size:1.4rem;
      font-weight:600;
      color:#fff;
      margin-top:12px;
      letter-spacing:.02em;
    }
    .logo-wrap p {
      font-size:.75rem;
      color:#888;
      margin-top:4px;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:500;
    }

    .form-group {
      margin-bottom:20px;
    }
    .form-group label {
      display:block;
      font-size:.7rem;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:#999;
      margin-bottom:8px;
    }
    .form-group input {
      width:100%;
      background:#1A1A1A;
      border:1px solid #333;
      color:#E5E7EB;
      border-radius:10px;
      padding:13px 16px;
      font-size:.9rem;
      font-family:'Inter',system-ui,sans-serif;
      transition: border-color .2s, box-shadow .2s;
      outline:none;
    }
    .form-group input::placeholder { color:#555; }
    .form-group input:focus {
      border-color:#D4AF37;
      box-shadow: 0 0 0 3px rgba(212,175,55,.1);
    }

    .login-btn {
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:.85rem;
      font-weight:700;
      font-family:'Inter',system-ui,sans-serif;
      cursor:pointer;
      background:linear-gradient(135deg,#BF953F,#FCF6BA,#B38728);
      color:#000;
      letter-spacing:.03em;
      transition: filter .2s, transform .15s;
      margin-top:8px;
    }
    .login-btn:hover {
      filter:brightness(1.1);
      transform:translateY(-1px);
    }
    .login-btn:active {
      transform:translateY(0);
    }

    .error-msg {
      display:none;
      text-align:center;
      background:rgba(239,68,68,.1);
      border:1px solid rgba(239,68,68,.25);
      color:#EF4444;
      font-size:.78rem;
      font-weight:500;
      padding:10px 14px;
      border-radius:10px;
      margin-top:16px;
      animation: shake .4s ease-out;
    }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      20%,60% { transform:translateX(-6px); }
      40%,80% { transform:translateX(6px); }
    }

    .footer-text {
      text-align:center;
      margin-top:28px;
      font-size:.65rem;
      color:#444;
      letter-spacing:.05em;
    }

    /* Loader overlay */
    .loader-overlay {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(10,10,10,.85);
      backdrop-filter:blur(4px);
      z-index:100;
      align-items:center;
      justify-content:center;
    }
    .loader-overlay.active { display:flex; }
    .spinner {
      width:36px;
      height:36px;
      border:3px solid #333;
      border-top-color:#D4AF37;
      border-radius:50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="./Logomarca.png" alt="Studio Jane Barreiros">
        <h1>Painel Administrativo</h1>
        <p>Acesso Restrito</p>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input id="login-senha" type="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">Entrar</button>
        <div class="error-msg" id="login-erro">E-mail ou senha incorretos.</div>
      </form>

      <p class="footer-text">Studio Jane Barreiros &copy; 2026</p>
    </div>
  </div>

  <script>
    (function () {
      /* Se já autenticado, redireciona */
      var token = sessionStorage.getItem('jane-admin-auth');
      if (token) {
        window.location.href = './admin.html';
        return;
      }

      var form = document.getElementById('login-form');
      var erro = document.getElementById('login-erro');
      var loader = document.getElementById('loader');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('login-email').value.trim().toLowerCase();
        var senha = document.getElementById('login-senha').value;

        if (!email || !senha) {
          erro.textContent = 'Preencha todos os campos.';
          erro.style.display = 'block';
          return;
        }

        /* Mostrar loader */
        loader.classList.add('active');

        setTimeout(function () {
          /* Usa o Booking module se disponível */
          var B = window.Booking;
          var ok = false;
          if (B && B.adminLogin) {
            ok = B.adminLogin(senha);
          } else {
            ok = (senha === 'jane2026');
          }

          if (ok) {
            try {
              sessionStorage.setItem('jane-admin-auth', '1');
            } catch (e) {}
            window.location.href = './admin.html';
          } else {
            loader.classList.remove('active');
            erro.style.display = 'block';
            erro.style.animation = 'none';
            void erro.offsetWidth;
            erro.style.animation = 'shake .4s ease-out';
          }
        }, 600);
      });

      erro.addEventListener('click', function () {
        erro.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
